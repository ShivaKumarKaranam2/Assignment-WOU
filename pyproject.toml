[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-agentic-health"
version = "0.1.0"
description = "Agentic health insurance claims processing with LangGraph and LangSmith"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "streamlit>=1.37.0",
  "langgraph>=0.2.34",
  "langchain>=0.3.7",
  "langchain-core>=0.3.21",
  "langchain-nvidia-ai-endpoints>=0.3.13",
  "langsmith>=0.1.143",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "python-multipart>=0.0.9",
  "requests>=2.32.3",
  "pymupdf>=1.24.10",
  "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "httpx>=0.27.2",
]

[project.scripts]
claims-api = "claims_app.api:run"
claims-ui = "claims_app.ui:run"
claims-eval-cases = "claims_app.case_runner:run_from_cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
